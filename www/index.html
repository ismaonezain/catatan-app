<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F4EF">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Catat.in</title>
<style>
@font-face{font-family:"Bricolage";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --paper:#F2F4EF; --card:#FFFFFF; --ink:#12211C; --ink2:#5B6B65; --line:#DCE2DC;
  --accent:#1E6B4F; --on-accent:#FFFFFF; --warn:#D9822B; --danger:#C8372D;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0F1713; --card:#17221C; --ink:#E9F0EB; --ink2:#93A59C; --line:#26332B;
        --accent:#4DB38A; --on-accent:#0B1410; --warn:#E69A4A; --danger:#EF6A5F;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper)}
body{font-family:"Bricolage",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:16px;line-height:1.35;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#view{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 10px) 18px 110px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink2)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--accent);font-weight:650}
.fab{position:absolute;right:18px;bottom:calc(68px + env(safe-area-inset-bottom));background:var(--accent);color:var(--on-accent);border-radius:999px;padding:14px 22px 14px 18px;font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}

h1,h2{margin:0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px -6px 4px}
.mnav button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);font-size:26px;line-height:1}
.mnav button:disabled{opacity:.25}
.mnav h1{font-size:17px;font-weight:600}
.page-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 0 14px}

.hero{padding:6px 0 4px}
.lbl{color:var(--ink2);margin:0;font-size:15px}
.big{font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.big small{font-size:.42em;font-weight:500;color:var(--ink2);margin-right:7px;letter-spacing:0}
.pita{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.pita i{display:block;height:100%;min-width:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 0}
.stat+.stat{border-left:1px solid var(--line);padding-left:16px}
.stat .lbl{font-size:14px}
.stat b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}

.alert{border-left:4px solid var(--warn);padding:6px 0 6px 12px;margin:14px 0;font-size:15px}
.alert.over{border-color:var(--danger)}
.alert b{font-weight:650}

.day{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px;color:var(--ink2);font-size:14px;font-weight:550}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;color:var(--ink2);font-size:13px}
.ra{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{margin:56px 8px;text-align:left}
.empty h2{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.empty p{margin:0;color:var(--ink2)}

.sect{margin:26px 0 6px;font-size:17px;font-weight:650}
.legend .row{padding:9px 0}
.legend .ra small{display:block;font-weight:500;color:var(--ink2);font-size:13px;text-align:right}
.donut{display:block;width:min(260px,72vw);margin:10px auto 4px}
.donut text{fill:var(--ink);font-family:inherit}
.note-line{margin:4px 0 0;color:var(--ink2);font-size:15px}
.bars{display:block;width:100%;height:auto;margin-top:8px}
.bars text{fill:var(--ink2);font-size:9px;font-family:inherit}

.bud{padding:14px 0;border-bottom:1px solid var(--line);width:100%;display:block}
.bud .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.bud .top b{font-weight:600;display:flex;align-items:center;gap:10px}
.bud .meter{height:8px;border-radius:4px;background:var(--line);margin:9px 0 6px;overflow:hidden}
.bud .meter i{display:block;height:100%;border-radius:4px}
.bud small{color:var(--ink2);font-size:14px}
.bud small.bad{color:var(--danger);font-weight:600}

.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row span.g{flex:1}
.set-row small{display:block;color:var(--ink2);font-size:13px}
.set-row .del{color:var(--danger);font-size:14px;padding:6px 0 6px 10px}
.set-row.danger{color:var(--danger)}
.foot{margin:28px 0 0;color:var(--ink2);font-size:14px}

/* sheet catat */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none}
.sh-head button,.sh-head label{padding:8px 0;font-weight:550;color:var(--ink2);font-size:16px}
.sh-head .title{font-weight:650;color:var(--ink)}
.sh-head .datebtn{position:relative;color:var(--accent);font-weight:650;display:inline-block}
.sh-head .datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.sh-head .rm{color:var(--danger)}
.amt{display:flex;align-items:baseline;gap:8px;margin:4px 0 6px;flex:none;min-height:64px}
.amt .cur{font-size:22px;font-weight:500;color:var(--ink2)}
.amt .num{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt .num.zero{color:var(--line)}
.amt .num.long{font-size:42px}
.note{width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;padding:10px 0;font-size:17px;border-radius:0;flex:none}
.note::placeholder{color:var(--ink2);opacity:.8}
.note:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;overflow-y:auto;min-height:0;flex:0 1 auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px;white-space:nowrap}
.chip .dot{width:10px;height:10px}
.chip[aria-pressed="true"]{border-color:var(--c);font-weight:650;box-shadow:inset 0 0 0 1px var(--c)}
.chip.ghost{border-style:dashed;color:var(--ink2);background:none}
.favs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;flex:none}
.favs .chip{background:none;border-color:transparent;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink2)}
.favs-l{font-size:13px;color:var(--ink2);margin:10px 0 0;flex:none}
.sp{flex:1}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;flex:none}
.keys button{height:54px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.keys button:active{background:var(--line)}
.keys svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.save{height:56px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;text-align:center;margin-bottom:10px;flex:none;width:100%}
.save:disabled{opacity:.35}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
.mbox{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px}
.mbox h2{font-size:20px;letter-spacing:-.01em;margin-bottom:6px}
.mbox p{margin:0 0 12px;color:var(--ink2)}
.mbox input[type=text],.mbox input[type=number],.mbox input[type=tel]{width:100%;font-size:22px;font-weight:600;padding:10px 0;border:0;border-bottom:1.5px solid var(--line);background:none;border-radius:0}
.mbox input:focus{outline:none;border-color:var(--accent)}
.mact{display:flex;justify-content:flex-end;gap:6px;margin-top:18px}
.mact button{padding:10px 14px;border-radius:10px;font-weight:600;color:var(--ink2)}
.mact .pri{background:var(--accent);color:var(--on-accent)}
.mact .dng{color:var(--danger)}
.mact .pri.dng{background:var(--danger);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.sw button{width:34px;height:34px;border-radius:50%;background:var(--c)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
#toast{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;max-width:min(92vw,440px);font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast button{color:#7FD3AE;font-weight:700;white-space:nowrap}
@media (prefers-color-scheme:dark){#toast button{color:#1E6B4F}}
#toast.warn{border-left:5px solid var(--warn)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.fab{display:none}}
</style>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <button class="fab" id="fab" aria-label="Catat pengeluaran baru"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Catat</button>
  <nav aria-label="Menu utama">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Beranda</button>
    <button data-tab="stat"><svg viewBox="0 0 24 24"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/></svg>Statistik</button>
    <button data-tab="budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12h.01"/></svg>Budget</button>
    <button data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Atur</button>
  </nav>
</div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';

/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const group = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const rp = n => 'Rp\u00A0' + group(n);
const short = n => n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace('.', ',') + 'jt' : n >= 1e3 ? Math.round(n / 1e3) + 'rb' : String(n);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const ymOf = s => s.slice(0, 7);
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const monthLabel = m => BULAN[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
const shiftMonth = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1); return ymd(d).slice(0, 7); };
const daysIn = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function dayLabel(d) {
  const t = today(); const y = ymd(new Date(Date.now() - 864e5));
  if (d === t) return 'Hari ini';
  if (d === y) return 'Kemarin';
  const x = parse(d); return HARI[x.getDay()] + ', ' + x.getDate() + ' ' + BLN[x.getMonth()];
}
function shortDate(d) {
  const t = today(); const y = ymd(new Date(Date.now() - 864e5));
  if (d === t) return 'Hari ini'; if (d === y) return 'Kemarin';
  const x = parse(d); return x.getDate() + ' ' + BLN[x.getMonth()] + (x.getFullYear() !== new Date().getFullYear() ? ' ' + x.getFullYear() : '');
}

/* ---------- data ---------- */
const KEY = 'catatin.v1';
const DEFAULT_CATS = [
  {id:'makan', name:'Makan', color:'#C8372D'},
  {id:'transport', name:'Transport', color:'#2C6AA0'},
  {id:'pulsa', name:'Pulsa & Data', color:'#6B4C9A'},
  {id:'listrik', name:'Listrik & Air', color:'#D9A81E'},
  {id:'belanja', name:'Belanja', color:'#1E6B4F'},
  {id:'jajan', name:'Jajan', color:'#D9822B'},
  {id:'zakat', name:'Zakat & Sedekah', color:'#8A6A4B'},
  {id:'lainnya', name:'Lainnya', color:'#7C8A86'}
];
const PALETTE = ['#1E6B4F','#2C6AA0','#6B4C9A','#C8372D','#D9822B','#D9A81E','#8A6A4B','#3A8F9A','#B0487A','#5E7A2E'];
let mem = null;
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return mem; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) { mem = v; } }
};
const fresh = () => ({v: 1, cats: DEFAULT_CATS.map(c => ({...c})), tx: [], budget: {}, last: null});
function load() {
  try { const r = store.get(); if (r) { const d = JSON.parse(r); return sanitize(d) || fresh(); } } catch (e) {}
  return fresh();
}
function sanitize(d) {
  if (!d || !Array.isArray(d.cats) || !Array.isArray(d.tx)) return null;
  const cats = d.cats.filter(c => c && typeof c.id === 'string' && typeof c.name === 'string').map(c => ({id: c.id, name: c.name.slice(0, 24), color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#7C8A86'}));
  if (!cats.some(c => c.id === 'lainnya')) cats.push({id:'lainnya', name:'Lainnya', color:'#7C8A86'});
  const tx = d.tx.filter(t => t && Number.isFinite(+t.a) && +t.a > 0 && /^\d{4}-\d{2}-\d{2}$/.test(t.d)).map(t => ({id: String(t.id || uid()), a: Math.round(+t.a), c: String(t.c), n: String(t.n || '').slice(0, 80), d: t.d, t: +t.t || 0}));
  const budget = {};
  Object.keys(d.budget || {}).forEach(k => { if (+d.budget[k] > 0) budget[k] = Math.round(+d.budget[k]); });
  return {v: 1, cats, tx, budget, last: d.last || null};
}
let S = load();
const save = () => store.set(JSON.stringify(S));
const catOf = id => S.cats.find(c => c.id === id) || S.cats.find(c => c.id === 'lainnya');
const sum = a => a.reduce((s, t) => s + t.a, 0);
const monthTx = m => S.tx.filter(t => t.d.startsWith(m));
const byCat = txs => { const m = {}; txs.forEach(t => { const id = catOf(t.c).id; m[id] = (m[id] || 0) + t.a; }); return m; };
const sortTx = a => a.slice().sort((x, y) => y.d.localeCompare(x.d) || y.t - x.t);

/* ---------- layers (tombol back Android) ---------- */
const layers = [];
function pushLayer(close) {
  let pushed = false;
  try { history.pushState({l: layers.length + 1}, ''); pushed = true; } catch (e) {}
  layers.push({close, pushed});
}
function closeTop() {
  const L = layers[layers.length - 1]; if (!L) return;
  if (L.pushed) { try { history.back(); return; } catch (e) {} }
  layers.pop(); L.close();
}
window.addEventListener('popstate', () => { const L = layers.pop(); if (L) L.close(); });

function modal(html, setup) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'modal';
    o.innerHTML = '<div class="mbox" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(o);
    let result = null;
    const done = v => { result = v; closeTop(); };
    pushLayer(() => { o.remove(); res(result); });
    o.addEventListener('click', e => { if (e.target === o) done(null); });
    setup(o.firstChild, done);
  });
}
const confirmBox = (title, msg, ok, danger) => modal(
  `<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="mact"><button data-no>Batal</button><button class="pri ${danger ? 'dng' : ''}" data-ok>${esc(ok)}</button></div>`,
  (b, done) => { $('[data-no]', b).onclick = () => done(false); $('[data-ok]', b).onclick = () => done(true); $('[data-ok]', b).focus(); }
).then(v => !!v);
const askNumber = (title, hint, val, canClear) => modal(
  `<h2>${esc(title)}</h2><p>${esc(hint)}</p><input type="tel" inputmode="numeric" id="n" placeholder="0" value="${val ? group(val) : ''}" autocomplete="off"><div class="mact">${canClear ? '<button class="dng" data-clr>Hapus batas</button>' : ''}<button data-no>Batal</button><button class="pri" data-ok>Simpan</button></div>`,
  (b, done) => {
    const i = $('#n', b);
    i.oninput = () => { const d = i.value.replace(/\D/g, '').slice(0, 11); i.value = d ? group(+d) : ''; };
    const ok = () => done(i.value ? +i.value.replace(/\D/g, '') : null);
    $('[data-ok]', b).onclick = ok; $('[data-no]', b).onclick = () => done(null);
    if (canClear) $('[data-clr]', b).onclick = () => done(0);
    i.onkeydown = e => { if (e.key === 'Enter') ok(); };
    setTimeout(() => { i.focus(); i.select(); }, 50);
  });
const addCatDialog = () => modal(
  `<h2>Kategori baru</h2><input type="text" id="cn" maxlength="24" placeholder="Nama kategori" autocomplete="off"><div class="sw">${PALETTE.map((c, i) => `<button style="--c:${c}" data-c="${c}" aria-label="Warna ${i + 1}" aria-pressed="${i === 0}"></button>`).join('')}</div><div class="mact"><button data-no>Batal</button><button class="pri" data-ok>Tambah</button></div>`,
  (b, done) => {
    let color = PALETTE[0];
    $$('.sw button', b).forEach(x => x.onclick = () => { color = x.dataset.c; $$('.sw button', b).forEach(y => y.setAttribute('aria-pressed', y === x)); });
    const ok = () => {
      const name = $('#cn', b).value.trim(); if (!name) { $('#cn', b).focus(); return; }
      if (S.cats.some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('Nama kategori sudah ada'); return; }
      const cat = {id: 'c' + uid(), name, color}; S.cats.splice(Math.max(0, S.cats.findIndex(c => c.id === 'lainnya')), 0, cat); save(); done(cat);
    };
    $('[data-ok]', b).onclick = ok; $('[data-no]', b).onclick = () => done(null);
    $('#cn', b).onkeydown = e => { if (e.key === 'Enter') ok(); };
    setTimeout(() => $('#cn', b).focus(), 50);
  });

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, opt = {}) {
  const t = $('#toast'); t.className = opt.warn ? 'warn' : '';
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (opt.action ? '<button>' + esc(opt.label || 'Urungkan') + '</button>' : '');
  t.hidden = false;
  if (opt.action) $('button', t).onclick = () => { t.hidden = true; opt.action(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, opt.action ? 5000 : 2600);
}

/* ---------- state tampilan ---------- */
let tab = 'home';
let vm = ymOf(today());
const isCur = () => vm === ymOf(today());

/* ---------- render ---------- */
function mnavHTML() {
  return `<div class="mnav"><button data-act="prev" aria-label="Bulan sebelumnya">‹</button><h1>${monthLabel(vm)}</h1><button data-act="next" aria-label="Bulan berikutnya" ${isCur() ? 'disabled' : ''}>›</button></div>`;
}
function weekStart() { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }

function budgetAlerts() {
  if (!isCur()) return '';
  const txs = monthTx(vm), bc = byCat(txs), out = [];
  if (S.budget.all) { const p = sum(txs) / S.budget.all; if (p >= .8) out.push({n: 'Total bulan ini', p, s: sum(txs), l: S.budget.all}); }
  S.cats.forEach(c => { const l = S.budget[c.id]; if (l) { const s = bc[c.id] || 0; if (s / l >= .8) out.push({n: c.name, p: s / l, s, l}); } });
  return out.sort((a, b) => b.p - a.p).slice(0, 3).map(a =>
    `<div class="alert ${a.p > 1 ? 'over' : ''}"><b>${esc(a.n)}</b> ${a.p > 1 ? 'melewati batas' : 'sudah ' + Math.floor(a.p * 100) + '% dari batas'}: ${rp(a.s)} dari ${rp(a.l)}</div>`).join('');
}

function homeHTML() {
  const txs = monthTx(vm), tot = sum(txs), bc = byCat(txs);
  const pita = Object.entries(bc).sort((a, b) => b[1] - a[1]).map(([id, v]) => `<i style="flex:${v};background:${catOf(id).color}" title="${esc(catOf(id).name)}"></i>`).join('');
  let stats;
  if (isCur()) {
    const t = today(), ws = weekStart();
    stats = `<div class="stat"><p class="lbl">Hari ini</p><b>${rp(sum(txs.filter(x => x.d === t)))}</b></div><div class="stat"><p class="lbl">Minggu ini</p><b>${rp(sum(S.tx.filter(x => x.d >= ws && x.d <= t)))}</b></div>`;
  } else {
    stats = `<div class="stat"><p class="lbl">Jumlah catatan</p><b>${txs.length}</b></div><div class="stat"><p class="lbl">Rata-rata per hari</p><b>${rp(tot / daysIn(vm))}</b></div>`;
  }
  let list;
  if (!txs.length) {
    list = `<div class="empty"><h2>${isCur() ? 'Belum ada catatan bulan ini' : 'Tidak ada catatan'}</h2><p>${isCur() ? 'Tekan Catat untuk mencatat pengeluaran pertama.' : 'Bulan ini kosong.'}</p></div>`;
  } else {
    const g = {}; sortTx(txs).forEach(t => (g[t.d] = g[t.d] || []).push(t));
    list = Object.keys(g).sort().reverse().map(d => `<div class="day"><span>${dayLabel(d)}</span><span>${rp(sum(g[d]))}</span></div>` +
      g[d].map(t => { const c = catOf(t.c); return `<button class="row" data-act="edit" data-id="${esc(t.id)}"><span class="dot" style="background:${c.color}"></span><span class="rt"><b>${esc(t.n || c.name)}</b>${t.n ? `<small>${esc(c.name)}</small>` : ''}</span><span class="ra">${rp(t.a)}</span></button>`; }).join('')).join('');
  }
  return `${mnavHTML()}<section class="hero"><p class="lbl">${isCur() ? 'Pengeluaran bulan ini' : 'Pengeluaran ' + monthLabel(vm)}</p><div class="big"><small>Rp</small>${group(tot)}</div>${tot ? `<div class="pita">${pita}</div>` : ''}</section><div class="stats">${stats}</div>${budgetAlerts()}${list}`;
}

function donutSVG(data, total) {
  const R = 64, C = 2 * Math.PI * R; let off = 0;
  const segs = data.map(d => { const len = C * d.v / total; const s = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${d.color}" stroke-width="26" stroke-dasharray="${Math.max(len - 1.5, 0.5)} ${C - Math.max(len - 1.5, 0.5)}" stroke-dashoffset="${-off}"/>`; off += len; return s; }).join('');
  return `<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Pengeluaran per kategori"><g transform="rotate(-90 90 90)">${segs}</g><text x="90" y="86" text-anchor="middle" font-size="11" opacity=".65">Total</text><text x="90" y="104" text-anchor="middle" font-size="16" font-weight="700">${short(total)}</text></svg>`;
}
function barsSVG(txs) {
  const n = daysIn(vm), vals = Array(n).fill(0); txs.forEach(t => { vals[+t.d.slice(8, 10) - 1] += t.a; });
  const max = Math.max(...vals, 1), W = 310, H = 90, bw = W / n, t = isCur() ? new Date().getDate() : -1;
  const bars = vals.map((v, i) => { const h = Math.max(v ? 2 : 0, v / max * H); return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${i + 1 === t ? 'var(--accent)' : 'var(--ink2)'}" opacity="${i + 1 === t ? 1 : .45}"/>`; }).join('');
  const lab = [1, 10, 20, n].map(d => `<text x="${((d - 1) * bw + bw / 2).toFixed(1)}" y="${H + 12}" text-anchor="middle">${d}</text>`).join('');
  return `<svg class="bars" viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Pengeluaran harian">${bars}${lab}</svg>`;
}
function statHTML() {
  const txs = monthTx(vm), tot = sum(txs);
  if (!tot) return `${mnavHTML()}<div class="empty"><h2>Belum ada data</h2><p>Statistik muncul setelah ada catatan di bulan ini.</p></div>`;
  const data = Object.entries(byCat(txs)).map(([id, v]) => ({id, v, color: catOf(id).color, name: catOf(id).name})).sort((a, b) => b.v - a.v);
  const prev = sum(monthTx(shiftMonth(vm, -1)));
  let cmp = '';
  if (prev) { const p = Math.round((tot - prev) / prev * 100); cmp = `<p class="note-line">${p === 0 ? 'Sama dengan' : (p > 0 ? 'Naik ' + p + '% dari' : 'Turun ' + (-p) + '% dari')} ${BULAN[+shiftMonth(vm, -1).slice(5, 7) - 1]} (${rp(prev)}).</p>`; }
  const elapsed = isCur() ? new Date().getDate() : daysIn(vm);
  return `${mnavHTML()}<h2 class="page-title">Statistik</h2>${donutSVG(data, tot)}${cmp}<p class="note-line">Rata-rata ${rp(tot / elapsed)} per hari.</p>
  <div class="legend"><h2 class="sect">Per kategori</h2>${data.map(d => `<div class="row"><span class="dot" style="background:${d.color}"></span><span class="rt"><b>${esc(d.name)}</b></span><span class="ra">${rp(d.v)}<small>${Math.round(d.v / tot * 100)}%</small></span></div>`).join('')}</div>
  <h2 class="sect">Per hari</h2>${barsSVG(txs)}`;
}

function budRow(key, name, color, spent) {
  const lim = S.budget[key];
  let body;
  if (lim) {
    const p = spent / lim, col = p > 1 ? 'var(--danger)' : p >= .8 ? 'var(--warn)' : color;
    body = `<div class="meter"><i style="width:${Math.min(100, p * 100)}%;background:${col}"></i></div><small class="${p > 1 ? 'bad' : ''}">${p > 1 ? 'Lebih ' + rp(spent - lim) : 'Sisa ' + rp(lim - spent)} dari batas ${rp(lim)}</small>`;
  } else body = `<div class="meter"></div><small>Belum ada batas. Ketuk untuk mengatur.</small>`;
  return `<button class="bud" data-act="budget" data-key="${esc(key)}"><div class="top"><b>${color ? `<span class="dot" style="background:${color}"></span>` : ''}${esc(name)}</b><span class="ra">${rp(spent)}</span></div>${body}</button>`;
}
function budgetHTML() {
  const txs = monthTx(vm), bc = byCat(txs);
  return `${mnavHTML()}<h2 class="page-title">Budget</h2><p class="lbl" style="margin:-6px 0 6px">Ketuk baris untuk mengatur batas bulanan. Anda diingatkan saat pemakaian mencapai 80%.</p>${budRow('all', 'Total semua kategori', '', sum(txs))}${S.cats.map(c => budRow(c.id, c.name, c.color, bc[c.id] || 0)).join('')}`;
}

function setHTML() {
  const n = S.tx.length;
  return `<h2 class="page-title">Atur</h2>
  <h2 class="sect">Kategori</h2>
  ${S.cats.map(c => `<div class="set-row"><span class="dot" style="background:${c.color}"></span><span class="g">${esc(c.name)}</span>${c.id === 'lainnya' ? '' : `<button class="del" data-act="delcat" data-id="${esc(c.id)}" aria-label="Hapus kategori ${esc(c.name)}">Hapus</button>`}</div>`).join('')}
  <button class="set-row" data-act="addcat"><span class="g" style="color:var(--accent);font-weight:650">Tambah kategori</span></button>
  <h2 class="sect">Data</h2>
  <button class="set-row" data-act="csv-month"><span class="g">Ekspor bulan ini (CSV)<small>Bisa dibuka di Excel atau Google Sheets</small></span></button>
  <button class="set-row" data-act="csv-all"><span class="g">Ekspor semua (CSV)<small>${n} catatan</small></span></button>
  <button class="set-row" data-act="backup"><span class="g">Cadangkan data<small>Simpan file cadangan, lalu kirim ke Google Drive atau WhatsApp</small></span></button>
  <button class="set-row" data-act="restore"><span class="g">Pulihkan dari cadangan<small>Mengganti semua data di HP ini</small></span></button>
  <button class="set-row danger" data-act="reset"><span class="g">Hapus semua data</span></button>
  <p class="foot">Semua data tersimpan di HP ini. Tanpa akun, tanpa internet.</p>
  <input type="file" id="file" accept=".json,application/json" hidden>`;
}

function render() {
  const v = $('#view'), st = v.scrollTop;
  v.innerHTML = tab === 'home' ? homeHTML() : tab === 'stat' ? statHTML() : tab === 'budget' ? budgetHTML() : setHTML();
  v.scrollTop = st;
  $$('nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.tab === tab)));
}

/* ---------- sheet catat ---------- */
function frequent() {
  const cut = ymd(new Date(Date.now() - 90 * 864e5)), m = {};
  S.tx.filter(t => t.d >= cut).forEach(t => { const k = t.c + '|' + t.a + '|' + t.n.trim().toLowerCase(); const e = m[k] || (m[k] = {c: t.c, a: t.a, n: t.n.trim(), k: 0, t: 0}); e.k++; e.t = Math.max(e.t, t.t); });
  return Object.values(m).filter(e => e.k >= 2 && S.cats.some(c => c.id === e.c)).sort((a, b) => b.k - a.k || b.t - a.t).slice(0, 4);
}
function openSheet(edit) {
  let amt = edit ? String(edit.a) : '';
  let cat = edit ? catOf(edit.c).id : (S.cats.some(c => c.id === S.last) ? S.last : S.cats[0].id);
  let date = edit ? edit.d : today();
  const favs = edit ? [] : frequent();
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', edit ? 'Ubah catatan' : 'Catat pengeluaran');
  el.innerHTML = `
  <div class="sh-head"><button data-x>Batal</button><span class="title">${edit ? 'Ubah catatan' : 'Catat pengeluaran'}</span>${edit ? '<button class="rm" data-rm>Hapus</button>' : '<span style="width:44px"></span>'}</div>
  <div class="amt"><span class="cur">Rp</span><span class="num" id="num"></span></div>
  <input class="note" id="note" maxlength="80" placeholder="Catatan (opsional)" autocomplete="off" enterkeyhint="done">
  <div class="chips" id="chips"></div>
  ${favs.length ? '<p class="favs-l">Sering dicatat</p><div class="favs" id="favs"></div>' : ''}
  <div class="sp"></div>
  <div style="display:flex;justify-content:flex-start;margin-bottom:2px"><span class="sh-head" style="height:auto"><label class="datebtn"><span id="dlabel"></span><input type="date" id="date"></label></span></div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k => `<button data-k="${k}">${k}</button>`).join('')}<button data-k="000">000</button><button data-k="0">0</button><button data-k="del" aria-label="Hapus angka terakhir"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m14 9 4 6m0-6-4 6"/></svg></button></div>
  <button class="save" id="save">${edit ? 'Simpan perubahan' : 'Simpan'}</button>`;
  document.body.appendChild(el);
  const num = $('#num', el), note = $('#note', el), chips = $('#chips', el), save$ = $('#save', el);
  note.value = edit ? edit.n : '';
  $('#date', el).value = date;
  function paint() {
    num.textContent = amt ? group(+amt) : '0';
    num.classList.toggle('zero', !amt); num.classList.toggle('long', amt.length > 8);
    save$.disabled = !amt;
    $('#dlabel', el).textContent = shortDate(date);
  }
  function paintChips() {
    chips.innerHTML = S.cats.map(c => `<button class="chip" style="--c:${c.color}" data-cat="${esc(c.id)}" aria-pressed="${c.id === cat}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('') + '<button class="chip ghost" data-newcat>+ Baru</button>';
  }
  if (favs.length) {
    $('#favs', el).innerHTML = favs.map((f, i) => `<button class="chip" data-fav="${i}">${esc(f.n || catOf(f.c).name)} ${short(f.a)}</button>`).join('');
    $('#favs', el).onclick = e => { const b = e.target.closest('[data-fav]'); if (!b) return; const f = favs[+b.dataset.fav]; amt = String(f.a); cat = f.c; note.value = f.n; paintChips(); paint(); };
  }
  chips.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.newcat !== undefined) { const c = await addCatDialog(); if (c) { cat = c.id; paintChips(); } return; }
    cat = b.dataset.cat; paintChips();
  };
  function key(k) {
    if (k === 'del') amt = amt.slice(0, -1);
    else if (amt === '' && (k === '0' || k === '000')) return;
    else if ((amt + k).length <= 11) amt += k;
    paint();
  }
  $('.keys', el).onclick = e => { const b = e.target.closest('[data-k]'); if (b) key(b.dataset.k); };
  $('#date', el).onchange = e => { if (e.target.value) { date = e.target.value; paint(); } };
  el.addEventListener('keydown', e => {
    if (e.target === note) { if (e.key === 'Enter') { e.preventDefault(); note.blur(); } return; }
    if (e.target.tagName === 'INPUT') return;
    if (/^\d$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('del'); else if (e.key === 'Enter') commit();
  });
  $('[data-x]', el).onclick = closeTop;
  if (edit) $('[data-rm]', el).onclick = async () => {
    if (!(await confirmBox('Hapus catatan ini?', rp(edit.a) + ' untuk ' + (edit.n || catOf(edit.c).name) + '.', 'Hapus', true))) return;
    const idx = S.tx.indexOf(edit), copy = edit; S.tx.splice(idx, 1); save(); closeTop(); render();
    toast('Catatan dihapus', {action: () => { S.tx.push(copy); save(); render(); }});
  };
  function commit() {
    const a = parseInt(amt || '0', 10);
    if (!a) { const n = $('.amt', el); n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); return; }
    const m = date.slice(0, 7), limit = S.budget[cat];
    const before = limit ? sum(monthTx(m).filter(t => catOf(t.c).id === cat && t !== edit)) : 0;
    let rec;
    if (edit) { Object.assign(edit, {a, c: cat, n: note.value.trim(), d: date}); rec = edit; }
    else { rec = {id: uid(), a, c: cat, n: note.value.trim(), d: date, t: Date.now()}; S.tx.push(rec); }
    S.last = cat; save(); vm = m; closeTop(); render();
    const c = catOf(cat);
    let warn = null;
    if (limit && m === ymOf(today())) { const p = (before + a) / limit; if (p > 1) warn = c.name + ' melewati batas bulan ini'; else if (p >= .8 && before / limit < .8) warn = c.name + ' sudah ' + Math.floor(p * 100) + '% dari batas'; }
    toast(warn || (c.name + ' ' + rp(a) + (edit ? ' diperbarui' : ' tersimpan')), {warn: !!warn, action: edit ? null : () => { S.tx = S.tx.filter(t => t !== rec); save(); render(); }});
  }
  save$.onclick = commit;
  paintChips(); paint();
  pushLayer(() => el.remove());
}

/* ---------- ekspor / impor ---------- */
async function saveFile(name, mime, text) {
  const C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Filesystem && C.Plugins.Share) {
    try {
      const r = await C.Plugins.Filesystem.writeFile({path: name, data: text, directory: 'CACHE', encoding: 'utf8'});
      await C.Plugins.Share.share({title: name, url: r.uri, dialogTitle: 'Simpan atau bagikan'});
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Gagal menyimpan file'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const q = v => { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCSV = rows => '\uFEFF' + ['Tanggal,Kategori,Catatan,Nominal'].concat(sortTx(rows).reverse().map(t => [t.d, catOf(t.c).name, t.n, t.a].map(q).join(','))).join('\r\n');

/* ---------- aksi ---------- */
document.addEventListener('click', async e => {
  const nb = e.target.closest('nav button');
  if (nb) { tab = nb.dataset.tab; render(); $('#view').scrollTop = 0; return; }
  if (e.target.closest('#fab')) { openSheet(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'prev') { vm = shiftMonth(vm, -1); render(); }
  else if (act === 'next') { if (!isCur()) { vm = shiftMonth(vm, 1); render(); } }
  else if (act === 'edit') { const t = S.tx.find(x => x.id === b.dataset.id); if (t) openSheet(t); }
  else if (act === 'budget') {
    const key = b.dataset.key, name = key === 'all' ? 'Total semua kategori' : catOf(key).name;
    const v = await askNumber('Batas ' + name, 'Per bulan, dalam Rupiah.', S.budget[key] || 0, !!S.budget[key]);
    if (v === null) return;
    if (v === 0) delete S.budget[key]; else S.budget[key] = v;
    save(); render();
  }
  else if (act === 'addcat') { const c = await addCatDialog(); if (c) render(); }
  else if (act === 'delcat') {
    const c = S.cats.find(x => x.id === b.dataset.id); if (!c) return;
    const n = S.tx.filter(t => t.c === c.id).length;
    if (!(await confirmBox('Hapus kategori ' + c.name + '?', n ? n + ' catatan akan dipindah ke Lainnya.' : 'Kategori ini belum dipakai.', 'Hapus', true))) return;
    S.tx.forEach(t => { if (t.c === c.id) t.c = 'lainnya'; });
    S.cats = S.cats.filter(x => x.id !== c.id); delete S.budget[c.id]; if (S.last === c.id) S.last = null;
    save(); render();
  }
  else if (act === 'csv-month') { const r = monthTx(vm); if (!r.length) { toast('Tidak ada catatan di ' + monthLabel(vm)); return; } saveFile('catatin-' + vm + '.csv', 'text/csv', toCSV(r)); }
  else if (act === 'csv-all') { if (!S.tx.length) { toast('Belum ada catatan'); return; } saveFile('catatin-semua.csv', 'text/csv', toCSV(S.tx)); }
  else if (act === 'backup') saveFile('catatin-cadangan-' + today() + '.json', 'application/json', JSON.stringify(S, null, 1));
  else if (act === 'restore') $('#file').click();
  else if (act === 'reset') {
    if (!(await confirmBox('Hapus semua data?', 'Semua catatan, kategori, dan budget akan hilang. Pastikan sudah dicadangkan.', 'Hapus semua', true))) return;
    S = fresh(); save(); vm = ymOf(today()); render(); toast('Semua data dihapus');
  }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'file') return;
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = sanitize(JSON.parse(await f.text()));
    if (!d) throw 0;
    if (!(await confirmBox('Pulihkan cadangan?', d.tx.length + ' catatan akan menggantikan semua data di HP ini.', 'Pulihkan', false))) return;
    S = d; save(); render(); toast('Data dipulihkan');
  } catch (err) { toast('File cadangan tidak valid'); }
});

/* ---------- mulai ---------- */
render();
if (/[?&]add=1/.test(location.search)) openSheet();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__catatin = {get S() { return S; }, openSheet, render};
})();
</script>
</body>
</html>
